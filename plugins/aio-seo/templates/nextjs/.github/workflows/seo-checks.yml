# SEO checks on every pull request: metadata, robots/sitemap/llms consistency and JSON-LD validity
# (vitest), then a Lighthouse budget on a production build (lighthouserc.json).
# Uses npm; switch the install and run commands if the repo uses pnpm or yarn
# (match config `project.build_commands`).
name: SEO checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: SEO unit tests
        run: npx vitest run tests/seo

      - name: Build
        run: npm run build

      - name: Lighthouse budget
        run: npx --yes @lhci/cli@0.14.0 autorun
